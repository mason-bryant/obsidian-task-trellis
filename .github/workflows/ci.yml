name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: python3 -m unittest discover -s tests -p ios_shortcut_test.py
      - run: npm run build
      - run: npm run check:release
      - run: npm run harness

  required:
    name: Tests and build
    if: always()
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Require both Node versions
        env:
          RESULT: ${{ needs.tests.result }}
        run: test "$RESULT" = success
