<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Task Trellis Harness</title>
    <style>
      /* Stand-ins for the Obsidian theme variables the plugin uses. */
      :root {
        --background-primary: #ffffff;
        --background-secondary: #f6f6f6;
        --background-modifier-border: #e0e0e0;
        --background-modifier-border-hover: #c8c8c8;
        --background-modifier-hover: rgba(0, 0, 0, 0.06);
        --text-normal: #222222;
        --text-muted: #5c5c5c;
        --text-faint: #999999;
        --text-accent: #7852ee;
        --interactive-accent: #7852ee;
        --color-red: #e93147;
        --color-red-rgb: 233, 49, 71;
        --text-error: #e93147;
        --size-4-4: 16px;
        --color-yellow-rgb: 224, 172, 0;
        --radius-s: 4px;
        --radius-m: 8px;
        --shadow-s: 0 1px 2px rgba(0, 0, 0, 0.06);
        --size-4-1: 4px;
        --size-4-2: 8px;
        --size-4-3: 12px;
        --size-4-6: 24px;
        --font-ui-smaller: 12px;
        --font-ui-small: 13px;
        --font-ui-medium: 15px;
        --font-normal: 400;
        --font-semibold: 600;
        --line-height-tight: 1.3;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --background-primary: #1e1e1e;
          --background-secondary: #262626;
          --background-modifier-border: #363636;
          --background-modifier-border-hover: #4a4a4a;
          --background-modifier-hover: rgba(255, 255, 255, 0.07);
          --text-normal: #dadada;
          --text-muted: #a3a3a3;
          --text-faint: #666666;
          --text-accent: #a68af9;
          --interactive-accent: #8a5cf5;
          --color-red: #fb464c;
        }
      }
      :root[data-theme='dark'] {
        --background-primary: #1e1e1e;
        --background-secondary: #262626;
        --background-modifier-border: #363636;
        --background-modifier-border-hover: #4a4a4a;
        --background-modifier-hover: rgba(255, 255, 255, 0.07);
        --text-normal: #dadada;
        --text-muted: #a3a3a3;
        --text-faint: #666666;
        --text-accent: #a68af9;
        --interactive-accent: #8a5cf5;
        --color-red: #fb464c;
      }
      body {
        margin: 0;
        background: var(--background-primary);
        color: var(--text-normal);
        font: 14px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      #board {
        height: calc(100vh - 48px);
        border-bottom: 1px solid var(--background-modifier-border);
      }
      /* ?sidebar: the boards sidebar, roughly where Obsidian's left sidebar is, or above the board on a phone. */
      #board-list {
        box-sizing: border-box;
        background: var(--background-secondary);
        border-bottom: 1px solid var(--background-modifier-border);
      }
      @media (min-width: 601px) {
        #board-list:not([hidden]) {
          position: fixed;
          top: 48px;
          bottom: 0;
          left: 0;
          width: 280px;
          overflow-y: auto;
          border-right: 1px solid var(--background-modifier-border);
        }
        #board-list:not([hidden]) ~ #board,
        #board-list:not([hidden]) ~ #source {
          margin-left: 281px;
        }
      }
      #source {
        padding: 8px 16px 32px;
        font: 12px/1.5 ui-monospace, Menlo, monospace;
        color: var(--text-muted);
      }
      #source h4 {
        margin: 12px 0 4px;
        color: var(--text-normal);
      }
      .src-line.is-highlighted {
        background: rgba(120, 82, 238, 0.15);
      }
      button {
        font: inherit;
        border: 0;
        border-radius: var(--radius-s);
        padding: 4px 12px;
        background: var(--background-modifier-hover);
        color: var(--text-normal);
        cursor: pointer;
      }
      button.mod-cta {
        background: var(--interactive-accent);
        color: #fff;
      }
      .clickable-icon {
        padding: 2px 6px;
        background: none;
      }
      input,
      select,
      textarea {
        font: inherit;
        color: var(--text-normal);
        background: var(--background-primary);
        border: 1px solid var(--background-modifier-border);
        border-radius: var(--radius-s);
        padding: 4px 8px;
      }
      /* Approximates Obsidian's setting rows and modal. */
      .setting-item {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 10px 0;
        border-top: 1px solid var(--background-modifier-border);
      }
      .setting-item-heading {
        border-top: 0;
      }
      .setting-item-heading .setting-item-name {
        font-weight: var(--font-semibold);
        font-size: 15px;
      }
      .setting-item-info {
        flex: 1;
      }
      .setting-item-description {
        color: var(--text-muted);
        font-size: 12px;
        padding-top: 2px;
      }
      .modal-button-container {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      dialog.tt-settings-modal {
        max-height: 85vh;
        padding: 16px 24px;
        border: 1px solid var(--background-modifier-border);
        border-radius: 12px;
        background: var(--background-primary);
        color: var(--text-normal);
      }
      dialog::backdrop {
        background: rgba(0, 0, 0, 0.5);
      }
      .modal-title {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .modal-close-button {
        position: absolute;
        top: 12px;
        right: 12px;
        font-size: 18px;
      }
      /* Obsidian's toggle switch. */
      .checkbox-container {
        position: relative;
        display: inline-block;
        width: 34px;
        height: 18px;
        border-radius: 9px;
        background: var(--background-modifier-border-hover);
        cursor: pointer;
        vertical-align: middle;
      }
      .checkbox-container input {
        display: none;
      }
      .checkbox-container::after {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #fff;
        transition: transform 120ms;
      }
      .checkbox-container.is-enabled {
        background: var(--interactive-accent);
      }
      .checkbox-container.is-enabled::after {
        transform: translateX(16px);
      }
      #toolbar {
        padding: 8px 12px 0;
      }
      /* Roughly Obsidian's menu as a phone shows it: a sheet from the bottom. */
      dialog.move-sheet {
        box-sizing: border-box;
        width: min(480px, 100vw);
        max-width: 100vw;
        max-height: 75vh;
        margin: auto auto 0;
        padding: 8px 0 16px;
        border: 1px solid var(--background-modifier-border);
        border-radius: 12px 12px 0 0;
        background: var(--background-primary);
        color: var(--text-normal);
      }
      .move-list {
        display: flex;
        flex-direction: column;
      }
      .move-label {
        padding: 10px 16px 4px;
        color: var(--text-muted);
        font-size: 12px;
        font-weight: 600;
      }
      .move-item {
        display: flex;
        align-items: baseline;
        min-height: 44px;
        padding: 0 16px;
        border-radius: 0;
        background: none;
        text-align: left;
      }
      .move-item:disabled {
        color: var(--text-muted);
        cursor: default;
      }
    </style>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <div id="toolbar" style="display:flex;align-items:center;gap:12px;padding:8px 16px;height:32px">
      <span style="font-size:12px;color:var(--text-muted)">Task Trellis · Preview</span>
      <button id="open-settings">Board settings</button>
      <label style="margin-left:auto">Theme <select id="theme" aria-label="Preview theme"><option value="dark">Dark</option><option value="light">Light</option></select></label>
      <label><input type="checkbox" id="show-source" /> Source</label>
    </div>
    <div id="board-list" hidden></div>
    <div id="board" class="task-trellis-view"></div>
    <dialog id="settings" class="tt-settings-modal">
      <button class="modal-close-button clickable-icon" aria-label="Close">×</button>
      <div class="modal-title">House board settings</div>
      <div class="modal-content"></div>
    </dialog>
    <dialog id="move" class="move-sheet" aria-label="Move to…"><div class="move-list"></div></dialog>
    <datalist id="property-keys"></datalist>
    <div id="source" hidden></div>
    <script src="harness.js"></script>
  </body>
</html>
